name = "pump-station-formal"
version = "0.1.0"
defaultTargets = ["Formal"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Formal"
globs = ["Formal", "Formal.*"]
